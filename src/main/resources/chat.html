<!DOCTYPE html>
<html>

<head>
	<title>One-to-One Chat</title>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<body>
	<input type="text" id="recipient" placeholder="Recipient">
	<input type="text" id="message" placeholder="Message">
	<button onclick="sendMessage()">Send</button>

	<ul id="messages"></ul>

	<script>
		let stompClient = null;
		let username = prompt("Enter your username:");

		function connect() {
			
			let socket = new SockJS('http://localhost:9092/chat');
			stompClient = Stomp.over(socket);
			stompClient.connect({}, function (frame) {
				console.log('Connected: ' + frame);

				stompClient.subscribe('/user/'+username+'/messages', function (msg) {
					const message = JSON.parse(msg.body);
					document.getElementById('messages').innerHTML +=
						`<li><strong>${message.sender}:</strong> ${message.content}</li>`;
				});
			});
		}

		function sendMessage() {
			let recipient = document.getElementById('recipient').value;
			let content = document.getElementById('message').value;

			stompClient.send("/app/private-message", {}, JSON.stringify({
				sender: username,
				recipient: recipient,
				content: content
			}));
		}

		connect();
	</script>

</body>

</html>
